[package]
name = "mincontainer"
version = "0.1.0"
edition = "2021"
description = "A minimal from-scratch Linux container runtime"

[dependencies]
nix = { version = "0.29", features = ["process", "sched", "mount", "hostname", "signal", "user", "fs"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }
seccompiler = "0.4"
caps = "0.5"

[[bin]]
name = "mincontainer"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
